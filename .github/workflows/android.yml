name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.1'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build and lint
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:lintDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatClip-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FloatClip-lint
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: FloatClip-debug
          path: release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="$(find release -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          cp "$apk" "release/FloatClip-${GITHUB_REF_NAME#v}-debug.apk"
          gh release create "$GITHUB_REF_NAME" \
            "release/FloatClip-${GITHUB_REF_NAME#v}-debug.apk" \
            --title "FloatClip ${GITHUB_REF_NAME#v}" \
            --generate-notes
