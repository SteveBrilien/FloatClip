name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.402'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Install Android 35 toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.1'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build and lint
        run: |
          bash scripts/create-nearby-debug-key.sh
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :nearby-probe:assembleDebug :nearby-probe:lintDebug --no-daemon --stacktrace

      - name: Test near-field wire compatibility
        run: |
          bash scripts/test-nearby-wire.sh
          dotnet run --project windows/FloatClip.NearbyProbe -c Release -- --self-test analysis/nearby-p0/wire-tests/vectors

      - name: Upload nearby probe CI APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatClip-nearby-probe-ci-only
          path: nearby-probe/build/outputs/apk/debug/nearby-probe-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload CI APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatClip-debug-ci-only
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FloatClip-lint
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select changed native release
        id: native_release
        env:
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json;print(json.load(open("updates/share-preview.json"))["version"])')"
          tag="v$version"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Tag does not match the frozen native release" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Resolve verified candidate assets
        if: steps.native_release.outputs.publish == 'true'
        id: release_assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.native_release.outputs.version }}"
          python3 - "$version" <<'PY'
          import base64,json,pathlib,subprocess,sys,tempfile,time
          version=sys.argv[1]
          feed=json.loads(pathlib.Path('updates/share-preview.json').read_text(encoding='utf-8'))
          assert feed['schema']==1 and feed['channel']=='share-preview'
          assert feed['version']==version,(feed['version'],version)
          token=json.loads(pathlib.Path('updates/native-updates.json').read_text())['nativeUpdates']['share-preview']
          header,payload,signature=token.split('.')
          decode=lambda value:base64.urlsafe_b64decode(value+'='*(-len(value)%4))
          assert json.loads(decode(header))['alg']=='RS256'
          signed=json.loads(decode(payload))
          assert signed['schema']==1 and signed['issuedAt']<=time.time()<signed['expiresAt']
          assert signed['release']==feed,'Plain release differs from the signed manifest'
          with tempfile.TemporaryDirectory() as directory:
              content=pathlib.Path(directory)/'content';sig=pathlib.Path(directory)/'signature'
              content.write_bytes((header+'.'+payload).encode('ascii'));sig.write_bytes(decode(signature))
              subprocess.run(['openssl','dgst','-sha256','-verify','updates/native-update-public.pem','-signature',str(sig),str(content)],check=True)
          for platform in ('android','windows'):
              row=feed[platform]
              assert row['version']==version and row['status']=='available'
              assert row['url'].startswith('https://')
              assert len(row['sha256'])==64 and row['bytes']>0
              pathlib.Path(f'.release-{platform}.json').write_text(json.dumps(row))
          PY
          android_url="$(python3 -c 'import json;print(json.load(open(".release-android.json"))["url"])')"
          windows_url="$(python3 -c 'import json;print(json.load(open(".release-windows.json"))["url"])')"
          curl --fail --location --retry 3 "$android_url" --output "FloatClip-Android-${version}.apk"
          curl --fail --location --retry 3 "$windows_url" --output "FloatClip-Windows-${version}.zip"
          python3 - "$version" <<'PY'
          import hashlib,json,pathlib,sys
          version=sys.argv[1]
          for platform,name in (
              ('android',f'FloatClip-Android-{version}.apk'),
              ('windows',f'FloatClip-Windows-{version}.zip'),
          ):
              row=json.load(open(f'.release-{platform}.json'))
              p=pathlib.Path(name); data=p.read_bytes()
              assert len(data)==row['bytes'],(platform,len(data),row['bytes'])
              assert hashlib.sha256(data).hexdigest()==row['sha256'],platform
          PY
          echo "android=FloatClip-Android-${version}.apk" >> "$GITHUB_OUTPUT"
          echo "windows=FloatClip-Windows-${version}.zip" >> "$GITHUB_OUTPUT"

      - name: Publish verified GitHub Release
        if: steps.native_release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID: ${{ steps.release_assets.outputs.android }}
          WINDOWS: ${{ steps.release_assets.outputs.windows }}
          RELEASE_TAG: ${{ steps.native_release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.native_release.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" "$ANDROID" "$WINDOWS" --target "$GITHUB_SHA" \
            --title "FloatClip $RELEASE_VERSION" \
            --generate-notes
