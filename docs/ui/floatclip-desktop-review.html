 function devicesPage(){return '<div class="dr-inline"><h2>我的设备</h2>'+toggle('sharing','共享剪贴板')+'</div><div class="dr-muted">'+(!state.sharing?'共享已关闭':state.connecting?'正在完成同步握手…':state.connected?'蓝牙同步就绪':'等待已授权设备自动连接')+'</div><div class="dr-scroll"><div class="dr-inline"><h3>已配对设备</h3>'+button('重新连接','reconnect')+'</div><div class="dr-peer">'+icon('smartphone')+'<div class="dr-peer-info"><div>V2115A</div><div class="dr-muted">'+(!state.sharing?'共享已关闭，配对已保留':!state.peer?'此设备已暂停':state.connected?'蓝牙同步就绪':'已授权 · 等待同步握手')+'</div></div>'+toggle('peer','与 V2115A 同步')+button(icon('ellipsis'),'peer-menu','dr-icon','aria-label="设备选项"')+'</div><details><summary class="cursor-interaction">添加设备</summary><div class="dr-muted">手机开启共享并允许添加设备，再核对两端识别码。</div><div class="dr-toolbar">'+button('通过蓝牙添加','pair-bluetooth','dr-bordered')+button('通过局域网添加','pair-lan','dr-bordered')+'</div></details><details><summary class="cursor-interaction">同步选项</summary>'+setting('自动连接已授权设备','',toggle('automatic','自动连接'))+setting('发送新复制的文字','',toggle('sending','发送文字'))+setting('接收文字到历史','',toggle('receiving','接收文字'))+setting('接收后写入系统剪贴板','',toggle('applying','自动写入剪贴板'))+'</details></div>';}

 function dialog(){const f=files.find(x=>state.selected.has(x.id));if(!state.dialog)return '';let title='文件选项',body='';

  else if(state.dialog==='save'){title='保存到文件夹';body='<div class="dr-muted">保存位置演示</div><div class="dr-row-setting">下载 / FloatClip</div><div class="dr-toolbar">'+button('开始下载','start-files','dr-bordered')+button('取消','close-dialog')+'</div>';}
  else if(state.dialog==='pair'){title='核对识别码';body='<div class="dr-muted">配对流程演示</div><p style="font-size:24px;letter-spacing:5px">842 196</p><div>两端显示一致后允许连接。</div>'+button('一致，允许连接','confirm-pair','dr-bordered');}
  else if(state.dialog==='more'){body='<div style="display:flex;flex-direction:column;align-items:flex-start">'+button('保留 / 取消保留','keep-files')+button('清理所选下载缓存','clear-cache')+button('移除所选记录','remove-files')+'<label>按时间筛选 <select aria-label="文件时间筛选" data-setting="range"><option value="all">全部时间</option><option value="day">最近24小时</option><option value="week">最近7天</option><option value="month">最近30天</option></select></label></div>';}
  else if(state.dialog==='forward'){title='转发到设备';body=button('发送到 V2115A（演示）','send-forward','dr-bordered');}

  else {title='剪贴板操作';body='<div>向右滑动：固定 / 取消固定<br>向左滑动：置顶 / 删除<br>右键：打开同一组操作<br>全部清除会保留固定与置顶记录。</div>';}

 function render(){paint();main.innerHTML=({files:filesPage,clipboard:clipboardPage,devices:devicesPage,settings:settingsPage,updates:updatesPage}[state.page])()+dialog();app.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-current',b.dataset.page===state.page?'page':'false'));const theme=main.querySelector('select[data-setting=theme]');if(theme)theme.value=state.theme;const range=main.querySelector('select[data-setting=range]');if(range)range.value=state.range;message.hidden=!state.notice;message.innerHTML='<span>'+esc(state.notice)+'</span>'+(state.undo.length?button('撤销','undo'):'')+button(icon('x'),'dismiss','dr-icon','aria-label="关闭提示"');if(globalThis.lucide)lucide.createIcons({attrs:{width:17,height:17}});}
 let progressTimer=null;function startDownload(){const picked=files.filter(f=>state.selected.has(f.id));if(picked.some(f=>!f.local&&!f.online)){state.dialog='';state.notice='来源设备离线，未开始传输';render();return;}const remote=picked.filter(f=>!f.local);state.dialog='';if(!remote.length){state.notice='文件已在本机，可另存为（演示）';render();return;}state.task={names:remote.map(f=>f.name),ids:remote.map(f=>f.id),total:remote.reduce((a,f)=>a+f.size,0),progress:0,phase:'running'};clearInterval(progressTimer);progressTimer=setInterval(()=>{if(state.task?.phase!=='running'){clearInterval(progressTimer);return;}state.task.progress=Math.min(100,state.task.progress+9);if(state.task.progress===100){state.task.phase='done';files.forEach(f=>{if(state.task.ids.includes(f.id))f.local=true;});clearInterval(progressTimer);}render();},260);render();}
 function reconnect(){if(!state.sharing||!state.peer){state.notice='先开启共享和设备同步';render();return;}state.connecting=true;state.connected=false;render();setTimeout(()=>{state.connecting=false;state.connected=state.sharing&&state.peer;render();},1200);}
 app.addEventListener('click',e=>{const b=e.target.closest('button');if(b){if(b.dataset.page){state.page=b.dataset.page;state.dialog='';state.notice='';render();persist();return;}const a=b.dataset.action,f=files.find(x=>state.selected.has(x.id)),c=clips.find(x=>x.id===b.dataset.id);
  if(a==='nav')state.nav=!state.nav;
  else if(a==='pin-window'){state.pinned=!state.pinned;b.setAttribute('aria-pressed',state.pinned);b.setAttribute('aria-label',state.pinned?'取消固定面板':'固定面板');return;}
  else if(a==='hide')state.notice='窗口收起操作（演示）';
  else if(a==='add-file'){picker.click();return;}
  else if(a==='download-files')state.dialog=state.selected.size?'save':'';
  else if(a==='start-files'){startDownload();return;}
  else if(a==='preview-file')state.dialog='preview';
  else if(a==='forward-files')state.dialog='forward';
  else if(a==='send-forward'){state.dialog='';state.notice='转发流程演示，未发送真实文件';}
  else if(a==='file-more')state.dialog='more';
  else if(a==='properties')state.dialog=f?'properties':'';
  else if(a==='keep-files'){files.forEach(x=>{if(state.selected.has(x.id))x.kept=!x.kept;});state.dialog='';state.notice='所选文件保留标记已更新（演示）';}
  else if(a==='clear-cache'){files.forEach(x=>{if(state.selected.has(x.id)&&!x.kept&&x.source!=='本机')x.local=false;});state.dialog='';state.notice='已跳过保留文件与本机原文件（演示）';}
  else if(a==='remove-files'){files=files.filter(x=>!state.selected.has(x.id)||x.kept);state.selected.clear();state.dialog='';state.notice='已移除普通记录，保留项目未移除（演示）';}
  else if(a==='sort'){state.descending=state.sort===b.dataset.sort?!state.descending:false;state.sort=b.dataset.sort;}
  else if(a==='task-action'){if(state.task?.phase==='running'){state.task.phase='cancelled';clearInterval(progressTimer);}else state.task=null;}
  else if(a==='close-dialog')state.dialog='';
  else if(a==='reconnect'){reconnect();return;}
  else if(a==='pair-bluetooth'||a==='pair-lan')state.dialog='pair';
  else if(a==='confirm-pair'){state.dialog='';reconnect();return;}
  else if(a==='peer-menu')state.dialog='peer';
  else if(a==='forget-peer'){state.connected=false;state.peer=false;state.dialog='';state.notice='移除配对流程演示；未操作真实手机';}
  else if(a==='clear-search')state.query='';
  else if(a==='filter')state.filter=b.dataset.filter;
  else if(a==='clear-clips'){state.undo=clips.filter(x=>!x.locked&&!x.pinned);clips=clips.filter(x=>x.locked||x.pinned);state.notice='普通记录已清除，固定和置顶记录已保留';}
  else if(a==='undo'){clips.push(...state.undo);state.undo=[];state.notice='已撤销清除';}
  else if(a==='lock-clip'&&c)c.locked=!c.locked;
  else if(a==='pin-clip'&&c)c.pinned=!c.pinned;
  else if(a==='delete-clip'&&c){state.undo=[{...c}];clips=clips.filter(x=>x.id!==c.id);state.notice='记录已删除（演示）';}
  else if(a==='clip-help')state.dialog='help';
  else if(a==='dismiss')state.notice='';
  else if(a==='shortcut')state.notice='快捷键录制流程在原生程序中操作';
  else if(a==='check-update'){state.update='checking';render();setTimeout(()=>{state.update='available';render();},700);return;}
  else if(a==='download-update'){state.update='ready';state.notice='更新下载流程演示，不下载真实安装包';}
  else if(a==='install-update'){state.update='done';state.notice='更新流程演示完成，未替换程序';}
  render();persist();return;

 app.addEventListener('keydown',e=>{if(e.key==='Escape'){state.dialog='';main.querySelectorAll('[data-swipe]').forEach(x=>x.dataset.swipe='');render();}if(e.ctrlKey&&e.key==='a'&&state.page==='files'&&!e.target.matches('input,textarea')){e.preventDefault();state.selected=new Set(visibleFiles().map(f=>f.id));render();}});
 window.addEventListener('openai:set_globals',e=>{const saved=e.detail?.globals?.widgetState?.privateContent;if(!saved)return;if(['light','dark','system','tokyo-night'].includes(saved.theme))state.theme=saved.theme;if(['files','clipboard','devices','settings','updates'].includes(saved.page))state.page=saved.page;render();});
 render();if(globalThis.Tweak){const tweak=new Tweak({container:app,onChange:()=>{paint();persist();}});tweak.addSlider(state,'width',{label:'窗口宽度',min:420,max:1000,step:10,unit:'px'});}
})();
</script>
